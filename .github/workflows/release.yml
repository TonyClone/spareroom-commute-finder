name: Build release binaries

# Builds a standalone Flatfinder executable for Windows and macOS and attaches
# them to the GitHub Release when you push a tag like v0.1.0.
#   git tag v0.1.0 && git push origin v0.1.0
# The release body comes from .github/RELEASE_NOTES.md — a non-technical
# walkthrough, so the Releases page is self-explanatory without the README.
# See PACKAGING.md for details and the code-signing note (unsigned binaries still
# trigger SmartScreen/Gatekeeper — signing is the only true fix).

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # allow manual runs to test the build

permissions:
  contents: write
  id-token: write        # for build-provenance attestations
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Flatfinder-windows.exe
            pyinstaller_name: Flatfinder
          - os: macos-latest
            artifact: Flatfinder-macos.zip
            pyinstaller_name: Flatfinder
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build executable
        run: >
          pyinstaller --onefile --console --name ${{ matrix.pyinstaller_name }}
          --collect-submodules flatfinder
          --collect-submodules pydantic
          --exclude-module streamlit
          --exclude-module pandas
          --exclude-module pytest
          packaging/flatfinder_launcher.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: mv dist/${{ matrix.pyinstaller_name }}.exe dist/${{ matrix.artifact }}

      # Zip the macOS binary: a bare Mach-O loses its execute bit over a plain
      # HTTP download, so double-clicking it does nothing. Archive Utility
      # restores the +x stored in the zip, making unzip → right-click → Open work.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x dist/${{ matrix.pyinstaller_name }}
          cd dist && zip -X ${{ matrix.artifact }} ${{ matrix.pyinstaller_name }}

      # Free supply-chain provenance (does NOT affect SmartScreen — see PACKAGING.md).
      # Non-fatal so a provenance hiccup can never fail the actual release build.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          body_path: .github/RELEASE_NOTES.md
