[project]
name = "flatfinder"
version = "0.1.0"
description = "Find London flatshares by real door-to-door commute time (SpareRoom + TfL), not map distance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["spareroom", "tfl", "london", "flatshare", "commute", "housing", "scraper"]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "streamlit>=1.32.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
flatfinder = "flatfinder.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
